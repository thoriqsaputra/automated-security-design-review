services:
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  postgres:
      image: pgvector/pgvector:pg16
      env_file:
        - ./backend/.env
      volumes:
        - postgres_data:/var/lib/postgresql/data
      ports:
        - "5432:5432"
      networks:
        - internal
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 10s
      restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    volumes:
      - minio_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  backend:
    image: automated-sdr-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/llm_logs:/app/llm_logs
      - ./backend/sdr/apps/ai/evaluations/results:/app/sdr/apps/ai/evaluations/results
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      internal:
        aliases:
          - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "-S", "-L", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  worker:
    image: automated-sdr-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/llm_logs:/app/llm_logs
    command:
      [
        "sh",
        "-c",
        "celery -A sdr.celery_app worker --loglevel=$${CELERY_WORKER_LOGLEVEL:-info} --queues=$${CELERY_WORKER_QUEUES:-sdr_analysis,celery} --concurrency=$${CELERY_WORKER_CONCURRENCY:-2} --prefetch-multiplier=$${CELERY_WORKER_PREFETCH_MULTIPLIER:-1} $${CELERY_WORKER_FAIR_SCHEDULING:--Ofair}",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - internal
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/docker-http.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "--no-check-certificate", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    command: --model-id mixedbread-ai/mxbai-embed-large-v1 --tokenization-workers 2
    environment:
      - OMP_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - RAYON_NUM_THREADS=2
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    volumes:
      - embeddings_data:/data
    expose:
      - "80"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s
    restart: unless-stopped

volumes:
  postgres_data:
  embeddings_data:
  minio_data:

networks:
  internal:
    driver: bridge
